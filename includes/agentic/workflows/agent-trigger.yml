# Starts the AI agent for one GitHub issue.
# Routes to the AI agent configured in the AGENT_PROVIDER repository variable.
#
# Alpaca starts this workflow with workflow_dispatch after Fix With AI creates
# the issue.
#
# Supported providers:
#   claude        → Claude Code via anthropics/claude-code-action (default, fully supported)
#   openai-codex  → OpenAI Codex CLI (stub — extend for your setup)
#   custom        → repository_dispatch event (bring your own listener)
#
# Setup:
#   1. Set AGENT_PROVIDER in Settings → Secrets and variables → Variables (defaults to claude)
#   2. Add CLAUDE_CODE_OAUTH_TOKEN to Settings → Secrets
#   3. Run the Setup Labels workflow once to create all labels
#   4. AI PRs target ALPACA_AI_TARGET_BRANCH (set by Alpaca when it installs these files)
#   5. Security policy lives at .github/alpaca/security/agent.json (installed by Alpaca)
#
# If AGENT_PROVIDER is not set, the workflow defaults to claude.

name: Alpaca AI Agent

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to work on'
        required: true
        type: string

# One run at a time per issue. The queued run checks for an existing branch and exits.
concurrency:
  group: alpaca-ai-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALPACA_AI_TARGET_BRANCH: ${{ vars.ALPACA_AI_TARGET_BRANCH || '__ALPACA_AI_TARGET_BRANCH__' }}

jobs:
  # Loads the issue from the workflow_dispatch input.
  resolve-issue:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.issue.outputs.number }}
      title: ${{ steps.issue.outputs.title }}
      is_high: ${{ steps.issue.outputs.is_high }}
      should_run: ${{ steps.issue.outputs.should_run }}
    permissions:
      contents: read
      issues: read

    steps:
      - name: Load issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            // Jobs are gated on should_run, so the other outputs can stay unset when we stop.
            const skip = (reason) => {
              console.log(reason);
              core.setOutput('should_run', 'false');
            };

            const issueNumber = Number(context.payload.inputs?.issue_number || 0);
            if (!issueNumber) {
              skip('No issue number was provided.');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map(l => l.name);
            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title || '');
            core.setOutput('is_high', labels.includes('complexity:high') ? 'true' : 'false');

            const heads = [`agent/fix-${issueNumber}`, `plan/issue-${issueNumber}`];
            for (const head of heads) {
              try {
                await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${head}`,
                });
                skip(`Branch ${head} already exists, so this issue is already being worked on.`);
                return;
              } catch (error) {
                const status = error.status || error.response?.status;
                if (status !== 404) {
                  throw error;
                }
              }
            }

            console.log(`Starting agent for issue #${issueNumber}: ${issue.title}`);
            core.setOutput('should_run', 'true');

  # ─────────────────────────────────────────────────────────────────────────────
  # CLAUDE (default)
  # Uses Claude Code with complexity-aware execution.
  #
  # complexity:high  → planning phase, human approves via /approve-plan, then implementation
  # complexity:low/medium (or absent) → implement directly
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-claude:
    needs: resolve-issue
    if: |
      needs.resolve-issue.outputs.should_run == 'true' &&
      (vars.AGENT_PROVIDER == 'claude' || vars.AGENT_PROVIDER == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ALPACA_AI_TARGET_BRANCH }}

      - name: Prepare Alpaca security settings
        id: security
        run: |
          SECURITY_FILE=".github/alpaca/security/agent.json"
          if [ -f "$SECURITY_FILE" ]; then
            jq '{permissions: .permissions}' "$SECURITY_FILE" > /tmp/claude-security-settings.json
            POLICY="$(jq -r '.issue_content_policy // empty' "$SECURITY_FILE")"
          else
            echo '{"permissions":{"defaultMode":"bypassPermissions"}}' > /tmp/claude-security-settings.json
            POLICY=""
          fi
          {
            echo "policy<<EOF"
            printf '%s\n' "$POLICY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── HIGH COMPLEXITY: plan first, then gate on /approve-plan ──────────────
      - name: Run Claude Code — Planning Phase (complexity:high)
        id: claude-plan
        if: needs.resolve-issue.outputs.is_high == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: /tmp/claude-security-settings.json
          claude_args: "--permission-mode bypassPermissions"
          additional_permissions: |
            actions: read
          prompt: |
            ${{ steps.security.outputs.policy }}

            You are planning the implementation for issue #${{ needs.resolve-issue.outputs.number }}.

            Issue title: ${{ needs.resolve-issue.outputs.title }}

            This is a complexity:high issue. Your job is to PLAN, not implement.

            Instructions:
            1. Read the full issue body:
               gh issue view ${{ needs.resolve-issue.outputs.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md for project-specific coding standards and file conventions
            3. Read the key files referenced in Technical Notes to understand existing patterns
            4. Write a structured implementation plan as a markdown file saved to:
               docs/plans/YYYY-MM-DD-NNN-<type>-<short-title>-plan.md
               The plan should include: problem frame, requirements, scope boundaries,
               key technical decisions, and implementation units (each with goal, files,
               approach, and test scenarios)
            5. Commit the plan file to a new branch named:
               plan/issue-${{ needs.resolve-issue.outputs.number }}
               Branch off of `${{ env.ALPACA_AI_TARGET_BRANCH }}` (the PR target branch).
            6. After committing, post a comment on the issue with:
               - A link to the plan file (GitHub URL)
               - "Implementation plan is ready for review. Reply /approve-plan to begin
                 implementation, or comment with feedback to revise the plan."
            7. Do NOT write any application code
            8. Do NOT open a pull request

      # ── LOW/MEDIUM COMPLEXITY: execute directly ──────────────────────────────
      - name: Run Claude Code — Direct Execution (complexity:low/medium)
        id: claude-work
        if: needs.resolve-issue.outputs.is_high == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: /tmp/claude-security-settings.json
          claude_args: "--permission-mode bypassPermissions"
          additional_permissions: |
            actions: read
          prompt: |
            ${{ steps.security.outputs.policy }}

            You are implementing issue #${{ needs.resolve-issue.outputs.number }}.

            Issue title: ${{ needs.resolve-issue.outputs.title }}

            Target branch for the PR: `${{ env.ALPACA_AI_TARGET_BRANCH }}`

            Instructions:
            1. Read the full issue body carefully using the GitHub CLI:
               gh issue view ${{ needs.resolve-issue.outputs.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md for project coding standards, file conventions, and architecture
            3. Implement the feature following the acceptance criteria exactly
            4. Stay within the defined scope — "Out of scope" is a hard boundary
            5. Follow the patterns referenced in Technical Notes (read the key files listed there)
            6. Create a branch, commit your changes, and open a PR:
               - Branch off of `${{ env.ALPACA_AI_TARGET_BRANCH }}`
               - Branch name: agent/fix-${{ needs.resolve-issue.outputs.number }}
               - PR title should match the issue title
               - PR base must be `${{ env.ALPACA_AI_TARGET_BRANCH }}` (use `gh pr create --base ${{ env.ALPACA_AI_TARGET_BRANCH }}`)
               - PR body: reference "Closes #${{ needs.resolve-issue.outputs.number }}" and summarize what you did
               - Use the template at .github/PULL_REQUEST_TEMPLATE/agent-generated.md
            7. Add the 'agent-generated' label to the PR
            8. After the PR is open, update the original issue's acceptance criteria:
               - Check off any criteria your implementation directly satisfies
               - Leave unchecked anything that requires manual testing, human review, or CI

            If you are blocked or unclear on something, post a comment on the issue
            asking for clarification rather than guessing.

      - name: Check for missing CLAUDE_CODE_OAUTH_TOKEN
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.resolve-issue.outputs.number }},
              body: [
                '⚠️ **Agent setup incomplete**',
                '',
                'The Claude Code workflow failed. This is usually caused by a missing `CLAUDE_CODE_OAUTH_TOKEN` secret.',
                '',
                'To fix: go to **Settings → Secrets and variables → Secrets** and add `CLAUDE_CODE_OAUTH_TOKEN`.',
                '',
                'See `.github/` for setup instructions.'
              ].join('\n')
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # OPENAI CODEX (stub)
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-openai-codex:
    needs: resolve-issue
    if: |
      needs.resolve-issue.outputs.should_run == 'true' &&
      vars.AGENT_PROVIDER == 'openai-codex'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ needs.resolve-issue.outputs.number }}
          ISSUE_TITLE: ${{ needs.resolve-issue.outputs.title }}
        run: |
          echo "OpenAI Codex provider stub — configure this step for your setup"
          echo "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"

  # ─────────────────────────────────────────────────────────────────────────────
  # CUSTOM — repository_dispatch
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-custom:
    needs: resolve-issue
    if: |
      needs.resolve-issue.outputs.should_run == 'true' &&
      vars.AGENT_PROVIDER == 'custom'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Dispatch alpaca-agent event
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.resolve-issue.outputs.number }},
            });

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'alpaca-agent',
              client_payload: {
                issue_number: issue.number,
                issue_title: issue.title,
                issue_body: issue.body,
                issue_url: issue.html_url,
                labels: issue.labels.map(l => l.name)
              }
            });
            console.log(`Dispatched alpaca-agent event for issue #${issue.number}`);
