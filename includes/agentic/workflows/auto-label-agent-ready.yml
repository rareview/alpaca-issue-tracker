# Nominates structurally complete issues for human review.
# Only a maintainer should apply 'agent-ready' to start execution.

name: Auto-Label Agent Candidates

on:
  issues:
    types: [opened, edited]

jobs:
  check-and-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check issue structure and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Required sections for an agent candidate.
            const requiredSections = [
              '## Summary',
              '## Context',
              '## Acceptance Criteria',
              '## Scope',
              '## Technical Notes'
            ];

            const hasAllSections = requiredSections.every(section =>
              body.includes(section)
            );

            const hasInScope = body.includes('**In scope:**') || body.includes('In scope:');
            const hasOutScope = body.includes('**Out of scope:**') || body.includes('Out of scope:');
            const hasScopeBoundaries = hasInScope && hasOutScope;

            const hasAcceptanceCriteria = /- \[[ x]\]/.test(body);

            const currentLabels = issue.labels.map(l => l.name);
            const hasAgentReadyLabel = currentLabels.includes('agent-ready');
            const hasCandidateLabel = currentLabels.includes('agent-candidate');

            if (hasAllSections && hasScopeBoundaries && hasAcceptanceCriteria) {
              if (!hasAgentReadyLabel && !hasCandidateLabel) {
                console.log('Issue meets candidate criteria, adding label');
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['agent-candidate']
                });
              }
            } else {
              console.log('Issue missing requirements:');
              console.log('- All sections:', hasAllSections);
              console.log('- Scope boundaries:', hasScopeBoundaries);
              console.log('- Acceptance criteria:', hasAcceptanceCriteria);
            }
