# Listens for slash commands on issue comments:
#
#   /approve-plan  — resumes implementation after a complexity:high planning phase
#   /run-agent     — maintainer retry from a comment. Alpaca does not use this.
#
# Both commands require write or admin permission on the repo.
#
# The /approve-plan flow:
#   1. Alpaca starts agent-trigger.yml with workflow_dispatch. Claude commits a plan to docs/plans/
#   2. Claude posts a comment asking for /approve-plan
#   3. This workflow fires, verifies the commenter, then runs implementation
#
# The /run-agent flow:
#   1. User comments /run-agent on an issue
#   2. This workflow fires, verifies the commenter
#   3. Runs the same complexity-aware routing as agent-trigger.yml
#
# AI PRs target ALPACA_AI_TARGET_BRANCH (set by Alpaca when it installs these files).
# Security policy lives at .github/alpaca/security/agent.json (installed by Alpaca).

name: Plan Approval Gate

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ALPACA_AI_TARGET_BRANCH: ${{ vars.ALPACA_AI_TARGET_BRANCH || '__ALPACA_AI_TARGET_BRANCH__' }}

jobs:
  handle-approve-plan:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/approve-plan')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ALPACA_AI_TARGET_BRANCH }}

      - name: Prepare Alpaca security settings
        id: security
        run: |
          SECURITY_FILE=".github/alpaca/security/agent.json"
          if [ -f "$SECURITY_FILE" ]; then
            jq '{permissions: .permissions}' "$SECURITY_FILE" > /tmp/claude-security-settings.json
            POLICY="$(jq -r '.issue_content_policy // empty' "$SECURITY_FILE")"
          else
            echo '{"permissions":{"defaultMode":"bypassPermissions"}}' > /tmp/claude-security-settings.json
            POLICY=""
          fi
          {
            echo "policy<<EOF"
            printf '%s\n' "$POLICY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            let permLevel;
            try {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter
              });
              permLevel = result.data.permission;
            } catch (err) {
              permLevel = 'none';
            }

            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `@${commenter} Only collaborators with write access can approve plans. Your approval was not processed.`
              });
            }

            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Check for existing PR (idempotency)
        id: pr-check
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const existing = prs.find(pr =>
              pr.body && (
                pr.body.includes(`Closes #${issueNumber}`) ||
                pr.body.includes(`closes #${issueNumber}`) ||
                pr.body.includes(`Fixes #${issueNumber}`) ||
                pr.body.includes(`fixes #${issueNumber}`)
              )
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `Implementation is already in progress: ${existing.html_url}`
              });
              core.setOutput('already_running', 'true');
            } else {
              core.setOutput('already_running', 'false');
            }

      - name: Create the fix branch
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.pr-check.outputs.already_running == 'false'
        run: git checkout -B "agent/fix-${{ github.event.issue.number }}"

      - name: Run Claude Code — Implementation
        id: claude-work
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.pr-check.outputs.already_running == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: /tmp/claude-security-settings.json
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowedTools "Bash(git *),Bash(gh *)"
          additional_permissions: |
            actions: read
          prompt: |
            ${{ steps.security.outputs.policy }}

            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            Target branch for the PR: `${{ env.ALPACA_AI_TARGET_BRANCH }}`

            A human has approved the plan for this issue. Your job is to implement it.

            Instructions:
            1. Find the plan file in docs/plans/ that corresponds to this issue
               (look for a file matching issue-${{ github.event.issue.number }} or check recently committed files)
            2. Read AGENTS.md for project-specific coding standards and file conventions
            3. Implement the feature per the approved plan
            4. Commit your changes on the current branch.
               It is already named agent/fix-${{ github.event.issue.number }}
               and is based on `${{ env.ALPACA_AI_TARGET_BRANCH }}`.
               Do not push, and do not open a pull request. This workflow does that
               after you finish.
            5. Write a short summary of what you changed to /tmp/alpaca-pr-body.md.
               Do not commit that file.

            Stay within the issue's defined scope ("Out of scope" is a hard boundary).
            If blocked or uncertain, comment on the issue asking for clarification.

      - name: Open the pull request
        if: steps.claude-work.outcome == 'success'
        uses: ./.github/actions/open-agent-pr
        with:
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          head_branch: agent/fix-${{ github.event.issue.number }}
          open_pull_request: true
          github_token: ${{ github.token }}
          execution_file: ${{ steps.claude-work.outputs.execution_file }}

  # ─────────────────────────────────────────────────────────────────────────────
  # /run-agent — maintainer retry.
  # Alpaca starts the agent with workflow_dispatch.
  # ─────────────────────────────────────────────────────────────────────────────
  handle-run-agent:
    if: |
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/run-agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ALPACA_AI_TARGET_BRANCH }}

      - name: Prepare Alpaca security settings
        id: security
        run: |
          SECURITY_FILE=".github/alpaca/security/agent.json"
          if [ -f "$SECURITY_FILE" ]; then
            jq '{permissions: .permissions}' "$SECURITY_FILE" > /tmp/claude-security-settings.json
            POLICY="$(jq -r '.issue_content_policy // empty' "$SECURITY_FILE")"
          else
            echo '{"permissions":{"defaultMode":"bypassPermissions"}}' > /tmp/claude-security-settings.json
            POLICY=""
          fi
          {
            echo "policy<<EOF"
            printf '%s\n' "$POLICY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check commenter permissions
        id: permission-check
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const issueNumber = context.payload.issue.number;

            let permLevel;
            try {
              const result = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: commenter
              });
              permLevel = result.data.permission;
            } catch (err) {
              permLevel = 'none';
            }

            const allowed = ['write', 'admin'].includes(permLevel);
            console.log(`Commenter ${commenter} has permission: ${permLevel} — allowed: ${allowed}`);

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `@${commenter} Only collaborators with write access can trigger the agent. Your \`/run-agent\` command was not processed.`
              });
            }

            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Determine complexity
        id: complexity
        if: steps.permission-check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            const isHigh = labels.includes('complexity:high');
            console.log('Issue labels:', labels.join(', '));
            console.log('complexity:high:', isHigh);
            core.setOutput('is_high', isHigh ? 'true' : 'false');

      # ── HIGH COMPLEXITY: plan first ──────────────────────────────────────────
      - name: Create the plan branch
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.complexity.outputs.is_high == 'true'
        run: git checkout -B "plan/issue-${{ github.event.issue.number }}"

      - name: Run Claude Code — Planning Phase (complexity:high)
        id: claude-plan
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.complexity.outputs.is_high == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: /tmp/claude-security-settings.json
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowedTools "Bash(git *),Bash(gh *)"
          additional_permissions: |
            actions: read
          prompt: |
            ${{ steps.security.outputs.policy }}

            You are planning the implementation for issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            This is a complexity:high issue. Your job is to PLAN, not implement.

            Instructions:
            1. Read the full issue body:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md for project-specific coding standards and file conventions
            3. Read the key files referenced in Technical Notes to understand existing patterns
            4. Write a structured implementation plan as a markdown file saved to:
               docs/plans/YYYY-MM-DD-NNN-<type>-<short-title>-plan.md
               The plan should include: problem frame, requirements, scope boundaries,
               key technical decisions, and implementation units (each with goal, files,
               approach, and test scenarios)
            5. Commit the plan file on the current branch.
               It is already named plan/issue-${{ github.event.issue.number }}
               and is based on `${{ env.ALPACA_AI_TARGET_BRANCH }}`.
               Do not push. This workflow pushes the branch after you finish.
            6. Do NOT write any application code
            7. Do NOT open a pull request

      - name: Push the plan branch
        if: steps.claude-plan.outcome == 'success'
        uses: ./.github/actions/open-agent-pr
        with:
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          head_branch: plan/issue-${{ github.event.issue.number }}
          open_pull_request: false
          github_token: ${{ github.token }}
          execution_file: ${{ steps.claude-plan.outputs.execution_file }}

      # ── LOW/MEDIUM COMPLEXITY: execute directly ──────────────────────────────
      - name: Create the fix branch
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.complexity.outputs.is_high == 'false'
        run: git checkout -B "agent/fix-${{ github.event.issue.number }}"

      - name: Run Claude Code — Direct Execution (complexity:low/medium)
        id: claude-work
        if: |
          steps.permission-check.outputs.allowed == 'true' &&
          steps.complexity.outputs.is_high == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: /tmp/claude-security-settings.json
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowedTools "Bash(git *),Bash(gh *)"
          additional_permissions: |
            actions: read
          prompt: |
            ${{ steps.security.outputs.policy }}

            You are implementing issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            Target branch for the PR: `${{ env.ALPACA_AI_TARGET_BRANCH }}`

            Instructions:
            1. Read the full issue body carefully using the GitHub CLI:
               gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}
            2. Read AGENTS.md for project coding standards, file conventions, and architecture
            3. Implement the feature following the acceptance criteria exactly
            4. Stay within the defined scope — "Out of scope" is a hard boundary
            5. Follow the patterns referenced in Technical Notes (read the key files listed there)
            6. Commit your changes on the current branch.
               It is already named agent/fix-${{ github.event.issue.number }}
               and is based on `${{ env.ALPACA_AI_TARGET_BRANCH }}`.
               Do not push, and do not open a pull request. This workflow does that
               after you finish.
            7. Write a short summary of what you changed to /tmp/alpaca-pr-body.md.
               Do not commit that file.
            8. Update the original issue's acceptance criteria:
               - Check off any criteria your implementation directly satisfies
               - Leave unchecked anything that requires manual testing, human review, or CI

            If you are blocked or unclear on something, post a comment on the issue
            asking for clarification rather than guessing.

      - name: Open the pull request
        if: steps.claude-work.outcome == 'success'
        uses: ./.github/actions/open-agent-pr
        with:
          issue_number: ${{ github.event.issue.number }}
          issue_title: ${{ github.event.issue.title }}
          base_branch: ${{ env.ALPACA_AI_TARGET_BRANCH }}
          head_branch: agent/fix-${{ github.event.issue.number }}
          open_pull_request: true
          github_token: ${{ github.token }}
          execution_file: ${{ steps.claude-work.outputs.execution_file }}
