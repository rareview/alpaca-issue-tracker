name: Coding Standards Checks

on:
  pull_request:
    branches:
      - pragmatic
  push:
    branches:
      - pragmatic
  workflow_dispatch:

jobs:
  lint:
    name: Lint PHP, JavaScript, and CSS files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm install

      - name: Lint JavaScript files
        run: npm run lint:js

      - name: Lint CSS/SCSS files
        run: npm run lint:styles

      - name: Build assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Install Composer dependencies
        run: composer install

      - name: Lint PHP files
        run: npm run lint:php

      - name: Success
        run: echo "✅ All code quality checks passed!"
